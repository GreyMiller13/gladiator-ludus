name: Проверка и публикация игры

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Проверить механику и горячие клавиши
        run: npm test
      - name: Упаковать игру вместе с изображениями
        run: npm run build
      - name: Установить Chrome для проверки
        run: npx playwright install --with-deps chrome
      - name: Проверить запуск готового сайта в Chrome
        run: npm run test:release
      - name: Проверить интерфейс, экономику и боевые сценарии
        run: npm run test:ui
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000
